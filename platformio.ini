; MORPHASE - 4-operator FM polyphonic synthesizer for M5Stack Cardputer ADV
; PlatformIO + Arduino framework
;
; Build configuration inherited from C.P.S. (CardPuter Synth), where it is
; proven on the same hardware. See the notes below before changing anything.

[env:morphase]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 921600

; -Os (the Arduino ESP32 core default) on purpose. C.P.S. measured -O2 and
; found the AVERAGE improved while per-buffer PEAKS got worse: code runs
; from flash through an instruction cache, and -O2's inlining/unrolling
; makes the hot path bigger so it fits that cache less well. Do not
; "re-optimize" this without measuring audioTask timing again.

; NOTE: no PSRAM flags. The Cardputer ADV uses an ESP32-S3FN8 — 8MB flash,
; NO psram. Declaring -DBOARD_HAS_PSRAM makes the SDK hunt for a chip that
; is not fitted and fail at boot with "PSRAM chip not found".
;
; Internal DRAM is all there is and it is tight. C.P.S. measured ~59KB free
; heap before SD.begin() and ~31KB after (the card mount costs ~27KB).
; Every large buffer in this firmware is therefore a STATIC array (.bss),
; sized in config.h, and nothing large is allocated at runtime.
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; M5Cardputer library suite (includes M5Unified / M5GFX)
; v1.1.0 has a known bug with z/c/b/m key mapping -> require >= 1.1.1
; Board detection (M5.getBoard() == m5::board_t::board_M5CardputerADV)
; needs a reasonably recent M5Unified.
lib_deps =
    pololu/VL53L1X @ ^1.3.1
    m5stack/M5Cardputer @ ^1.1.1
    m5stack/M5Unified @ ^0.2.8
    m5stack/M5GFX @ ^0.2.10

; VL53L1X (v0.81): the theremin's Unit ToF4M, Pololu's driver as in C.P.S. -
; small, and it takes any TwoWire (Cap = the board's Wire1, Grove = Wire).
; SD and SPI are part of the Arduino-ESP32 core; no extra lib_deps needed.

; Post-build script: merges bootloader + partitions + firmware into a
; single file (.pio/build/morphase/merge.bin) for M5Burner / Launcher.
extra_scripts = post:merge_bin.py

; BLE build (v0.77, BLE stage 1): the same source with MORPHASE_BLE - BLE
; MIDI input, 10 voices, an 8-bit screen. The standard build above carries
; none of it (no NimBLE linked).
;
; NimBLE (BLE stage 1): peripheral only, one connection, host task on core 1
; (audioTask owns core 0). G - runtime memory, measured in stage 1: one bond
; and two CCCDs (no pairing), 4 ACL buffers from the controller and 6 msys
; blocks instead of 12 / 12 (BLE MIDI packets are small and few), and a
; 3072-byte host stack: v0.77T3s measured 2,088 bytes used at the deepest
; (4096 - 2008 free) with fast playing, CC sweeps and reconnects.
[env:morphase_ble]
extends = env:morphase
lib_deps = ${env:morphase.lib_deps}
    h2zero/NimBLE-Arduino @ 2.5.1
custom_ble_base_flags =
    -DMORPHASE_BLE
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
custom_ble_mem_flags =
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=2
    -DCONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=4
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=6
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=3072
build_flags = ${env:morphase.build_flags} ${this.custom_ble_base_flags} ${this.custom_ble_mem_flags}

; Screenshots for the manuals (v0.88, never released): the release builds
; plus Shift+P = save the screen to /MORPHASE/Shots/shot_NNN.bmp. Built by
; name only: pio run -e morphase_shot -e morphase_ble_shot
[env:morphase_shot]
extends = env:morphase
build_flags = ${env:morphase.build_flags} -DMORPHASE_SCREENSHOT

[env:morphase_ble_shot]
extends = env:morphase_ble
build_flags = ${env:morphase_ble.build_flags} -DMORPHASE_SCREENSHOT
; `pio run` builds the two release builds. The measurement builds of BLE
; stage 0 and stage 1 (ble232*, ble251*, blemin_*, ble_g0) were removed in
; the v0.87 clean-up; they are in releases/MORPHASE_v0.87_measure_tools.zip.
[platformio]
default_envs = morphase, morphase_ble
